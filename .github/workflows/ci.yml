name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dashboard/backend/requirements.txt

      - name: Run root Python tests
        run: |
          pytest tests

      - name: Run backend Python tests
        run: |
          cd dashboard/backend && pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard/frontend && npm ci

      - name: Build frontend
        run: |
          cd dashboard/frontend && npm run build

      - name: Run frontend unit tests
        run: |
          cd dashboard/frontend && npm run test
